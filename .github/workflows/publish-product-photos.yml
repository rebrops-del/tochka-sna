name: Publish product photos

on:
  push:
    paths:
      - '.github/workflows/publish-product-photos.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode product photo sprite
        run: |
          mkdir -p assets
          base64 -d assets/product-sprite.b64 > assets/product-sprite.webp
          test -s assets/product-sprite.webp

      - name: Add photos to all catalog cards
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          t = p.read_text(encoding='utf-8')

          def rep(old, new, label):
              global t
              if old not in t:
                  raise SystemExit(f'Missing expected fragment: {label}')
              t = t.replace(old, new, 1)

          if '.product-media{' not in t:
              rep(
                  '.body{padding:19px;',
                  '.product-media{aspect-ratio:4/3;background:#fff;overflow:hidden;border-bottom:1px solid #edf1ee}.product-photo{width:100%;height:100%;background-image:url("assets/product-sprite.webp");background-repeat:no-repeat;background-size:500% 500%;background-position:var(--px) var(--py);}.body{padding:19px;',
                  'catalog photo css'
              )

          if 'const PHOTO_POS=' not in t:
              photo_map = r'''const PHOTO_POS={
          'Матрас Imperial Suite кокос Gray Night':[0,0],
          'Матрас Imperial Suite латекс-кокос Gray Night':[25,0],
          'Матрас Imperial Suite холкон-кокос Gray Night':[50,0],
          'Матрас MEGA MULT ELITE MultiPocket Gray Night':[75,0],
          'Матрас MEGA MULT ЗИМА ЛЕТО MultiPocket Gray Night':[100,0],
          'Матрас MEGA MULT кокос ППУ 20 MultiPocket Gray Night':[0,25],
          'Матрас MEGA Элит Блитц TFK Gray Night':[25,25],
          'Матрас Барселона ZAСоня Gray Night':[50,25],
          'Матрас Валенсия ZAСоня Gray Night':[75,25],
          'Матрас Ибица ZAСоня Gray Night':[100,25],
          'Матрас Касабланка ZAСоня Gray Night':[0,50],
          'Матрас Стандарт':[25,50],
          'Матрас Mega кокос 10 TFK Gray Night':[50,50],
          'Матрас Mega кокос 10 TFK':[75,50],
          'Матрас Mega кокос 20 TFK Gray Night':[100,50],
          'Матрас Mega кокос 20 TFK':[0,75],
          'Матрас Mega кокос 30 TFK Gray Night':[25,75],
          'Матрас Mega кокос 30 TFK':[50,75],
          'Матрас MEGA ППУ 10 ECO':[75,75],
          'Матрас Mega холкон TFK Gray Night':[100,75],
          'Матрас Mega холкон-кокос TFK Gray Night':[0,100],
          'Наматрасник "Непромокаемый чехол"':[25,100],
          'Подушка Память форма':[50,100],
          'Матрас ППУ 16 ZAСоня':[75,100],
          'Матрас Солид ZaСоня':[100,100]
          };
          '''
              rep('let products=[];', photo_map + 'let products=[];', 'photo map')

          if 'photo=PHOTO_POS[x.model]' not in t:
              rep(
                  'const firm=getFirmness(x),hit=BESTSELLERS.has(x.model);',
                  'const firm=getFirmness(x),hit=BESTSELLERS.has(x.model),photo=PHOTO_POS[x.model]||null;',
                  'photo variable'
              )

          if '<div class="product-media">' not in t:
              rep(
                  'return `<article class="card"><div class="body">',
                  'return `<article class="card">${photo?`<div class="product-media"><div class="product-photo" role="img" aria-label="${safe(x.model)}" style="--px:${photo[0]}%;--py:${photo[1]}%"></div></div>`:\'\'}<div class="body">',
                  'card photo markup'
              )

          p.write_text(t, encoding='utf-8')

      - name: Validate site JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t = Path('index.html').read_text(encoding='utf-8')
          js = re.search(r'<script>(.*)</script>', t, re.S).group(1)
          Path('/tmp/site.js').write_text(js, encoding='utf-8')
          assert t.count('product-media') >= 2
          assert 'assets/product-sprite.webp' in t
          assert t.count("'Матрас ") >= 20
          PY
          node --check /tmp/site.js

      - name: Commit published photos
        run: |
          rm -f assets/product-sprite.b64 _photo_publish_placeholder.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/product-sprite.webp assets/product-sprite.b64 _photo_publish_placeholder.txt
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Add photos to all 25 catalog cards"
            git push
          fi
