name: Refine hero consultation caption

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-hero-free.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine consultation caption
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='</style>'
          css='''\n/* hero-free-clean-v1 */\n.hero .hero-free{position:absolute;z-index:3;right:7.5%;top:32.5%;display:flex;align-items:center;gap:9px;color:#0b6557;font-size:13.5px;line-height:1.38;font-weight:700;letter-spacing:.01em;background:transparent;padding:0;border:0;border-radius:0;box-shadow:none;backdrop-filter:none;text-align:left;text-shadow:0 1px 1px rgba(255,255,255,.95),0 2px 10px rgba(255,255,255,.88)}\n.hero .hero-free:before{content:"";display:block;width:3px;height:34px;border-radius:99px;background:#0a8d55;box-shadow:0 1px 5px rgba(255,255,255,.85);flex:0 0 auto}\n@media(max-width:760px){.hero .hero-free{right:6%;top:34%;font-size:13px}.hero .hero-free:before{height:31px}}\n'''
          if '/* hero-free-clean-v1 */' not in s:
              s=s.replace(marker,css+'\n'+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/refine-hero-free.yml
      - name: Commit refined caption
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/refine-hero-free.yml
          git commit -m 'Refine hero consultation caption'
          git push
