name: Apply outlined Avito buttons

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match card and header Avito buttons to hero style
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* avito-outline-buttons-v1 */'
          if marker not in s:
              css='''\n/* avito-outline-buttons-v1 */\n.nav .btn.avito,.card .btn{background:#fff;color:#0b503f;border:1.5px solid #159663;border-radius:999px;box-shadow:none;gap:13px;font-weight:900;filter:none}\n.nav .btn.avito{min-height:48px;padding:0 21px}\n.card .btn{height:54px;min-height:54px;padding:0 20px}\n.nav .btn.avito::after,.card .btn::after{content:"";display:block;flex:0 0 18px;width:18px;height:18px;background:radial-gradient(circle at 4px 4px,#00aaff 0 3.8px,transparent 4.1px),radial-gradient(circle at 14px 4px,#ff4053 0 3.8px,transparent 4.1px),radial-gradient(circle at 4px 14px,#965eeb 0 3.8px,transparent 4.1px),radial-gradient(circle at 14px 14px,#04e061 0 3.8px,transparent 4.1px)}\n.nav .btn.avito:hover,.card .btn:hover{background:#f7fcf9;border-color:#0a8d55;color:#083f3d;box-shadow:0 8px 20px rgba(10,141,85,.10);filter:none}\n'''
              if '\n</style>' not in s:
                  raise SystemExit('style close marker missing')
              s=s.replace('\n</style>',css+'\n</style>',1)
              p.write_text(s,encoding='utf-8')
          PY
          grep -q 'avito-outline-buttons-v1' index.html
          grep -q '.nav .btn.avito,.card .btn' index.html
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-avito-outline-buttons.yml
          git add index.html
          git commit -m "Match Avito buttons in header and product cards"
          git push
