name: Fix hero image

on:
  push:
    paths:
      - '.github/workflows/fix-hero-image.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify hero and refresh cache key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('assets/hero-consultant-mattress.webp')
          b=p.read_bytes()
          assert b[:4] == b'RIFF', b[:12]
          assert b[8:12] == b'WEBP', b[:12]
          assert len(b) == 15108, len(b)
          assert hashlib.sha256(b).hexdigest() == '8710fd59f12c0c11e4f7a8cb2c05a7be39ee3cb889531a1c37c0fa27f0aef99e'
          print('valid webp bytes:', len(b))
          PY
          sed -i 's/hero-consultant-mattress.webp?v=20260905-ref3/hero-consultant-mattress.webp?v=20260905-fix1/' index.html
          grep -q 'hero-consultant-mattress.webp?v=20260905-fix1' index.html
          git config user.name "rebrops-del"
          git config user.email "rebrops@gmail.com"
          git add index.html
          git commit -m "Refresh fixed hero image"
          git push origin HEAD:main
