name: Tune old price display

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tune-old-price.yml'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update old price styling only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.old-price{font-size:15px;line-height:1;color:#8a9790;text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:#8a9790;font-weight:700;white-space:nowrap}'
          new = '.old-price{font-size:18px;line-height:1;color:#111;text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:#111;font-weight:800;white-space:nowrap}'
          if old not in s:
              raise SystemExit('old-price CSS rule not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/tune-old-price.yml
      - name: Commit style update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/tune-old-price.yml
          git commit -m 'Improve old price visibility'
          git push
