name: Patch live hero

on:
  push:
    paths:
      - '.github/workflows/patch-hero.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch hero only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          old_header = '''<header class="hero" id="top"><div class="wrap"><div class="eyebrow">Екатеринбургский филиал федеральной онлайн-сети</div><h1>Комфортный сон начинается с правильного матраса</h1><p>«Точка Сна» работает в онлайн-формате: консультация и подбор — дистанционно, заказ оформляется через Avito. Екатеринбургский филиал обслуживает город и ближайшие районы, региональный склад расположен в г. Берёзовский.</p><div class="actions"><a class="btn light" href="#catalog">Смотреть каталог</a><a class="btn avito" target="_blank" rel="noopener">Получить консультацию в Avito</a></div><div class="advantages"><div class="adv"><strong>Подбор по параметрам</strong><span>Учитываем вес, позу сна, желаемую жёсткость и бюджет.</span></div><div class="adv"><strong>Сравнение конструкций</strong><span>Поможем разобраться в беспружинных моделях, TFK и MultiPocket.</span></div><div class="adv"><strong>Сужаем выбор</strong><span>Вместо десятков вариантов предложим 2–3 модели под ваш запрос.</span></div></div></div></header>'''

          new_header = '''<header class="hero" id="top"><div class="wrap"><div class="hero-grid"><div class="hero-copy"><div class="eyebrow">Екатеринбургский филиал федеральной онлайн-сети</div><h1>Комфортный сон начинается с правильного матраса</h1><p>«Точка Сна» работает в онлайн-формате: консультация и подбор — дистанционно, заказ оформляется через Avito. Екатеринбургский филиал обслуживает город и ближайшие районы, региональный склад расположен в г. Берёзовский.</p><div class="actions"><a class="btn light" href="#catalog">Смотреть каталог</a><a class="btn avito" target="_blank" rel="noopener">Получить консультацию в Avito</a></div></div><div class="hero-visual" aria-hidden="true"><img src="assets/hero-consultant-mattress.webp" alt="" loading="eager" decoding="async"></div></div><div class="advantages"><div class="adv"><strong>Подбор по параметрам</strong><span>Учитываем вес, позу сна, желаемую жёсткость и бюджет.</span></div><div class="adv"><strong>Сравнение конструкций</strong><span>Поможем разобраться в беспружинных моделях, TFK и MultiPocket.</span></div><div class="adv"><strong>Сужаем выбор</strong><span>Вместо десятков вариантов предложим 2–3 модели под ваш запрос.</span></div></div></div></header>'''

          marker = '/* hero-consultant-live */'
          extra_css = '''
/* hero-consultant-live */
.hero .wrap{padding:46px 0 38px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(360px,.92fr);gap:30px;align-items:center}
.hero-copy{min-width:0}
.hero h1{max-width:720px}
.hero p{max-width:690px}
.hero-visual{align-self:stretch;min-height:430px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.16);box-shadow:0 22px 55px rgba(15,72,51,.18)}
.hero-visual img{display:block;width:100%;height:100%;min-height:430px;object-fit:cover;object-position:center bottom}
.advantages{margin-top:24px}
@media(max-width:1000px){.hero-grid{grid-template-columns:1fr minmax(300px,.72fr);gap:20px}.hero-visual,.hero-visual img{min-height:370px}.hero h1{font-size:clamp(38px,5vw,54px)}}
@media(max-width:760px){.hero-grid{grid-template-columns:1fr}.hero-visual{min-height:330px;max-height:430px}.hero-visual img{min-height:330px;object-position:center 35%}.advantages{margin-top:18px}}
@media(max-width:620px){.hero .wrap{padding:30px 0 36px}.hero h1{font-size:38px}.hero-visual{border-radius:22px;min-height:300px}.hero-visual img{min-height:300px}.advantages{grid-template-columns:1fr}}
'''

          if old_header not in html:
              raise SystemExit('Expected live hero markup was not found; refusing to change anything else.')
          html = html.replace(old_header, new_header, 1)
          if marker not in html:
              html = html.replace('</style>', extra_css + '\n</style>', 1)

          p.write_text(html, encoding='utf-8')
          PY
      - name: Commit live hero
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Integrate consultant and mattress into live hero"
          git push
