name: Apply approved hero redesign

on:
  push:
    branches:
      - hero-redesign-20260905

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build verified hero image
        shell: bash
        run: |
          cat .hero-payload/part1.txt .hero-payload/part2.txt .hero-payload/part3.txt .hero-payload/part4.txt | tr -d '\n\r' | base64 -d > assets/hero-consultant-mattress.webp
          test "$(wc -c < assets/hero-consultant-mattress.webp)" = "29534"
          echo "bb6117113fe0a91f5178425d327a20db9570d3ed54f7f8b5680b2cab18f6831c  assets/hero-consultant-mattress.webp" | sha256sum -c -
          python -c "from pathlib import Path; b=Path('assets/hero-consultant-mattress.webp').read_bytes(); assert b[:4]==b'RIFF' and b[8:12]==b'WEBP'"

      - name: Apply hero-only patch
        run: python .hero-payload/apply.py

      - name: Verify protected site areas
        shell: bash
        run: |
          grep -q 'href="#catalog">Перейти в каталог' index.html
          grep -q 'hero-avito avito' index.html
          grep -q 'const AVITO=' index.html
          grep -q 'data/data1.json' index.html
          grep -q 'section delivery' index.html
          grep -q 'section network' index.html
          grep -q 'section guidepro' index.html
          grep -q 'section catalog' index.html
          test -s assets/hero-consultant-mattress.webp

      - name: Commit isolated hero replacement
        shell: bash
        run: |
          git rm -r .hero-payload
          git rm .github/workflows/apply-hero-redesign.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace homepage hero only"
          git push
