<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Точка Сна</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f7fa;color:#13263a;display:grid;place-items:center;min-height:100vh}.load{font-size:18px;font-weight:700}</style></head><body><div class="load">Загрузка каталога «Точка Сна»…</div><script>(async()=>{const files=['part01.txt','part02.txt','part03.txt','part04.txt','part05.txt','part06.txt'];let s='';for(const f of files)s+=await(await fetch(f,{cache:'no-store'})).text();const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()})().catch(e=>{document.body.innerHTML='<div class="load">Не удалось загрузить каталог. Обновите страницу.</div>';console.error(e)})</script></body></html>
