name: Apply agreed consultant hero

on:
  push:
    paths:
      - '.github/workflows/use-photo-rows.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply hero change
        run: python scripts/apply-agreed-hero.py
      - name: Verify hero and HTML sections
        run: |
          grep -q 'class="hero-visual"' index.html
          grep -q 'assets/hero-consultant-mattress.webp' index.html
          grep -q '<section class="section delivery" id="delivery">' index.html
          grep -q '<section class="section catalog" id="catalog">' index.html
          test -s assets/hero-consultant-mattress.webp
      - name: Commit hero change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Integrate consultant and mattress into live hero"
          git push
