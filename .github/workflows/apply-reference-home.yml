name: Apply reference home design

on:
  push:
    paths:
      - '.github/workflows/apply-reference-home.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply homepage design from approved reference
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          css = r'''
          /* approved-reference-home-v3 */
          :root{--ref-green:#078149;--ref-dark:#063845;--ref-soft:#eff9f3;--ref-line:#d7e9df}
          body{background:#fff;color:var(--ref-dark)}
          .wrap{width:min(1410px,calc(100% - 64px))}
          .top{display:none!important}
          .nav{background:#fff;border-bottom:1px solid #edf1ef;position:sticky;top:0;z-index:40;box-shadow:none;backdrop-filter:none}
          .navin{min-height:68px;gap:26px}
          .brand.ref-brand{gap:10px;min-width:260px}
          .ref-logo-text{font-size:28px;line-height:.9;font-weight:950;letter-spacing:-.045em;color:#073743;white-space:nowrap}
          .ref-logo-text small{display:block;margin-top:8px;font-size:9px;letter-spacing:.08em;font-weight:700;color:#294a55;text-transform:uppercase}
          .ref-leaf{display:inline-block;width:19px;height:26px;background:#0c9857;border-radius:18px 3px 18px 3px;transform:rotate(18deg);position:relative;margin-left:2px}
          .ref-leaf:after{content:"";position:absolute;width:12px;height:1px;background:#fff;left:2px;top:13px;transform:rotate(-38deg);transform-origin:left center}
          .navlinks{gap:31px;font-size:14px;font-weight:800;white-space:nowrap}
          .navlinks a{color:#0c2933}
          .navlinks a:hover{color:var(--ref-green)}
          .nav-searchbox{margin-left:auto;display:flex;align-items:center;width:min(360px,28vw);height:46px;background:#f4f6f7;border-radius:999px;padding:0 16px 0 21px}
          .nav-searchbox input{border:0;background:transparent;height:100%;padding:0;font-size:14px;color:#304b55;box-shadow:none}
          .nav-searchbox input:focus{box-shadow:none;border:0}
          .nav-searchbox span{font-size:24px;line-height:1;color:#062d39}
          .nav-icon{display:grid;place-items:center;width:38px;height:38px;color:#072d38;font-size:26px;text-decoration:none;flex:0 0 auto}
          .hero{background:linear-gradient(90deg,#f3fbf6 0%,#f7fbf8 43%,#fff 62%);border-bottom:0;overflow:hidden}
          .hero .wrap{width:100%;max-width:none;display:grid;grid-template-columns:minmax(560px,48%) 1fr;gap:0;padding:0;margin:0;align-items:stretch}
          .hero-copy{padding:38px 34px 86px clamp(32px,4.2vw,66px);display:flex;flex-direction:column;justify-content:center;min-width:0}
          .eyebrow{align-self:flex-start;background:linear-gradient(135deg,#43a96e,#5bb983);border:0;color:#fff;border-radius:999px;padding:11px 17px;font-size:14px;font-weight:800;margin-bottom:25px;box-shadow:0 10px 30px rgba(19,132,77,.12)}
          .eyebrow:before{width:14px;height:14px;border:2px solid #fff;background:transparent;box-sizing:border-box;position:relative}
          .hero h1{font-size:clamp(48px,4.1vw,64px);letter-spacing:-.045em;line-height:.99;margin:0 0 20px;max-width:670px;color:#063845;font-weight:950}
          .hero p{font-size:17px;line-height:1.48;color:#183f4a;max-width:620px;margin:0 0 26px}
          .actions{gap:12px;align-items:center}
          .hero .btn.hero-primary{min-height:58px;padding:0 30px;border-radius:999px;background:linear-gradient(135deg,#078347,#006c3f);box-shadow:0 10px 26px rgba(0,112,62,.16);color:#fff;border:0;font-size:16px}
          .hero .btn.hero-primary span{font-size:23px;margin-left:16px;font-weight:400}
          .hero .btn.hero-avito{min-height:58px;padding:0 27px;border-radius:999px;background:#fff;color:#0a4f3f;border:1.5px solid #0d8d57;box-shadow:none;font-size:15px;gap:14px}
          .avito-dots{display:grid;grid-template-columns:repeat(2,9px);gap:3px}
          .avito-dots i{display:block;width:9px;height:9px;border-radius:50%}.avito-dots i:nth-child(1){background:#00aaff}.avito-dots i:nth-child(2){background:#ff4053}.avito-dots i:nth-child(3){background:#965eec}.avito-dots i:nth-child(4){background:#04e061}
          .advantages{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:38px;max-width:720px}
          .adv{display:flex;align-items:center;gap:12px;padding:0;background:transparent;border:0;box-shadow:none;border-radius:0;min-width:0}
          .adv-icon{display:grid;place-items:center;width:54px;height:54px;flex:0 0 54px;border-radius:50%;background:#dff4e8;color:#07844b;font-size:28px;font-weight:500}
          .adv strong{font-size:13px;line-height:1.35;margin:0;color:#0b3440;font-weight:850}
          .adv span{display:none}
          .hero-visual{position:relative;width:100%;height:auto;min-height:612px;aspect-ratio:auto;border-radius:0;border:0;box-shadow:none;background:#f5f4ef;overflow:hidden}
          .hero-visual img{width:100%;height:100%;object-fit:cover;object-position:center center}
          .hero-note{position:absolute;left:3.5%;top:6%;font-family:"Segoe Script","Bradley Hand",cursive;font-size:clamp(25px,2.25vw,38px);line-height:1.16;color:#09624e;transform:rotate(-5deg);text-align:center;pointer-events:none;text-shadow:0 1px 0 #fff9}
          .hero-note b{font-weight:400}
          .hero-note-heart{display:inline-block;font-family:Arial,sans-serif;font-size:45px;line-height:.8;margin-left:8px;transform:rotate(7deg)}
          .hero-free{position:absolute;left:11%;top:31%;font-size:12px;line-height:1.45;color:#193c46;pointer-events:none}
          .delivery{background:#fff;padding:0 0 20px;margin-top:-46px;position:relative;z-index:5}
          .delivery .wrap{width:min(1410px,calc(100% - 108px))}
          .deliverybox{background:linear-gradient(135deg,#f1faf5,#edf8f2);border:1px solid #dfefe7;border-radius:30px;padding:20px 23px 27px;box-shadow:0 18px 45px rgba(29,92,65,.06)}
          .deliverybox h2{font-size:36px;letter-spacing:-.025em;margin:0 0 18px 18px;color:#063845;font-weight:950}
          .dgrid{grid-template-columns:repeat(4,1fr);gap:22px}
          .d{display:grid;grid-template-columns:66px 1fr;grid-template-rows:auto auto auto;column-gap:14px;align-items:center;padding:17px 18px;border-radius:19px;background:#fff;border:1px solid #e5eee9;box-shadow:none;color:#173844;min-height:132px}
          .d-icon{grid-row:1/4;display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:#e4f6ec;color:#077b47;font-size:29px}
          .d-label{font-size:14px;color:#173844;align-self:end}
          .d b{font-size:24px;line-height:1.1;margin:4px 0;color:#056b3f;font-weight:950;align-self:center}
          .d small{font-size:12px;color:#547180;line-height:1.35;align-self:start}
          .catalog{background:#fff;padding-top:34px}
          .catalog .wrap{width:min(1410px,calc(100% - 108px))}
          .head.catalog-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}
          .head.catalog-head h2{font-size:38px;color:#063845;letter-spacing:-.035em;font-weight:950}
          .catalog-all{font-size:14px;color:#0e3440;text-decoration:none;font-weight:800;white-space:nowrap}
          .catalog-all span{font-size:24px;margin-left:10px;vertical-align:-2px}
          .controls{border-radius:18px;background:#f5f8f6;border-color:#e1ebe6}
          .network,.guidepro{background:#fff}
          @media(max-width:1180px){.navlinks{gap:17px}.navlinks a:nth-child(4){display:none}.nav-searchbox{width:220px}.advantages{grid-template-columns:1fr 1fr}.hero .wrap{grid-template-columns:minmax(500px,52%) 1fr}.dgrid{gap:12px}}
          @media(max-width:900px){.navlinks{display:none}.nav-searchbox{width:min(320px,40vw)}.hero .wrap{grid-template-columns:1fr}.hero-copy{padding:38px 32px 40px}.hero-visual{min-height:520px}.delivery{margin-top:0;padding-top:22px}.delivery .wrap,.catalog .wrap{width:min(100% - 36px,1410px)}.dgrid{grid-template-columns:1fr 1fr}}
          @media(max-width:620px){body{padding-bottom:72px}.nav{display:block}.navin{min-height:64px}.brand.ref-brand{min-width:0}.ref-logo-text{font-size:22px}.ref-logo-text small{display:none}.nav-searchbox,.nav-icon{display:none}.hero h1{font-size:43px}.hero p{font-size:15px}.hero-copy{padding:28px 18px 34px}.eyebrow{font-size:11px;margin-bottom:18px}.hero .btn.hero-primary,.hero .btn.hero-avito{width:100%;min-height:54px}.advantages{grid-template-columns:1fr 1fr;gap:17px 10px}.adv-icon{width:46px;height:46px;flex-basis:46px;font-size:23px}.hero-visual{min-height:390px}.hero-note{font-size:24px;left:4%;top:6%}.hero-free{font-size:10px;left:8%;top:31%}.deliverybox{padding:19px 14px 18px}.deliverybox h2{font-size:30px;margin-left:4px}.dgrid{grid-template-columns:1fr}.d{min-height:112px}.head.catalog-head h2{font-size:31px}.catalog-all{font-size:12px}.catalog .wrap,.delivery .wrap{width:min(100% - 24px,1410px)}}
          '''
          if 'approved-reference-home-v3' not in s:
              s = s.replace('\n</style>', '\n' + css + '\n</style>', 1)

          new_nav = '''<nav class="nav"><div class="wrap navin"><a class="brand ref-brand" href="#top"><span class="ref-logo-text">ТОЧКА СНА<small>МАТРАСЫ ДЛЯ КОМФОРТНОЙ ЖИЗНИ</small></span><span class="ref-leaf"></span></a><div class="navlinks"><a href="#catalog">Каталог</a><a href="#about">О фабрике</a><a href="#delivery">Доставка и оплата</a><a href="#business">Для бизнеса</a><a href="#contacts">Контакты</a></div><label class="nav-searchbox"><input type="search" placeholder="Найти матрас..." aria-label="Найти матрас" oninput="const el=document.getElementById('q');if(el){el.value=this.value;el.dispatchEvent(new Event('input'))}"><span>⌕</span></label><a class="nav-icon" href="#catalog" aria-label="Избранное">♡</a><a class="nav-icon" href="#catalog" aria-label="Корзина">🛒</a></div></nav>'''
          s, n = re.subn(r'<div class="top">.*?</div>\s*<nav class="nav">.*?</nav>', new_nav, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('nav replace failed')

          new_hero = '''<header class="hero" id="top"><div class="wrap"><div class="hero-copy"><div class="eyebrow">⌾&nbsp; Екатеринбургский филиал федеральной онлайн-сети</div><h1>Комфортный сон начинается с правильного матраса</h1><p>Поможем подобрать матрас под ваши потребности: консультация, честные рекомендации и быстрая доставка по Екатеринбургу и ближайшим районам.</p><div class="actions"><a class="btn hero-primary" href="#catalog">Перейти в каталог <span>→</span></a><a class="btn hero-avito avito" target="_blank" rel="noopener">Получить консультацию в Avito <span class="avito-dots"><i></i><i></i><i></i><i></i></span></a></div><div class="advantages"><div class="adv"><span class="adv-icon">⌁</span><strong>Качественные<br>и безопасные<br>материалы</strong></div><div class="adv"><span class="adv-icon">⚙</span><strong>Современные<br>технологии</strong></div><div class="adv"><span class="adv-icon">✓</span><strong>Гарантия<br>качества</strong></div><div class="adv"><span class="adv-icon">₽</span><strong>Отличное соотношение<br>цены и качества</strong></div></div></div><div class="hero-visual"><img src="assets/hero-consultant-mattress.webp?v=20260905-ref3" alt="Консультант Точка Сна рядом с матрасом" width="900" height="847"><div class="hero-note"><b>Помогу выбрать<br>ваш идеальный<br>матрас</b><span class="hero-note-heart">♡</span></div><div class="hero-free">Бесплатная консультация<br>в удобном формате</div></div></div></header>'''
          s, n = re.subn(r'<header class="hero" id="top">.*?</header>', new_hero, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('hero replace failed')

          new_delivery = '''<section class="section delivery" id="delivery"><div class="wrap"><div class="deliverybox"><h2>Доставка и подъём</h2><div class="dgrid"><div class="d"><span class="d-icon">▣</span><span class="d-label">Доставка</span><b>1 500 ₽</b><small>по Екатеринбургу<br>и ближайшим районам</small></div><div class="d"><span class="d-icon">↕</span><span class="d-label">Грузовой лифт</span><b>600 ₽</b><small>подъём на этаж при наличии<br>грузового лифта</small></div><div class="d"><span class="d-icon">⌁</span><span class="d-label">По лестнице</span><b>300 ₽ / этаж</b><small>ручной подъём при отсутствии<br>лифта</small></div><div class="d"><span class="d-icon">▦</span><span class="d-label">График</span><b>Вторник / Пятница</b><small>плановые дни доставки</small></div></div></div></div></section>'''
          s, n = re.subn(r'<section class="section delivery" id="delivery">.*?</section>', new_delivery, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('delivery replace failed')

          old_head = '<div class="head"><h2>Каталог матрасов и товаров для сна</h2></div>'
          new_head = '<div class="head catalog-head"><h2>Каталог матрасов</h2><a class="catalog-all" href="#grid">Смотреть все <span>→</span></a></div>'
          if old_head not in s:
              raise SystemExit('catalog head not found')
          s = s.replace(old_head, new_head, 1)

          reorder = re.compile(r'(<section class="section network".*?</section>)\s*(<section class="section guidepro".*?</section>)\s*(<section class="section catalog".*?</section>)', re.S)
          m = reorder.search(s)
          if not m:
              raise SystemExit('section reorder pattern not found')
          s = s[:m.start()] + m.group(3) + '\n' + m.group(1) + '\n' + m.group(2) + s[m.end():]

          path.write_text(s, encoding='utf-8')
          PY
          git config user.name "rebrops-del"
          git config user.email "rebrops@gmail.com"
          git add index.html
          git rm .github/workflows/apply-reference-home.yml
          git commit -m "Match homepage to approved reference design"
          git push origin HEAD:main
