name: Fix hero bottom

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-hero-bottom.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply CSS crop
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); m='/* hero-bottom-crop-v1 */'; css='\\n\\n'+m+'\\n.hero-visual{overflow:hidden}\\n.hero-visual img{transform:scale(1.04);transform-origin:50% 0;will-change:transform}\\n'; p.write_text(s if m in s else s.rsplit('</style>',1)[0]+css+'</style>'+s.rsplit('</style>',1)[1],encoding='utf-8')"
          rm -f .github/workflows/fix-hero-bottom.yml
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html .github/workflows/fix-hero-bottom.yml
          git commit -m "Remove white strip from hero image bottom"
          git push
