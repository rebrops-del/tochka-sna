name: Improve hero caption contrast

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/improve-hero-caption-contrast.yml'
      - 'index.html'

permissions:
  contents: write

jobs:
  improve-caption:
    if: github.event.head_commit.message != 'Improve hero caption visibility'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Improve caption visibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* hero-free-contrast-v2 */'
          css = r'''
/* hero-free-contrast-v2 */
.hero .hero-free{
  right:6.5%;top:32%;
  color:#064f46;
  font-size:15.5px;
  line-height:1.34;
  font-weight:900;
  letter-spacing:.005em;
  padding:8px 24px 8px 11px;
  background:linear-gradient(90deg,rgba(255,255,255,.88) 0%,rgba(255,255,255,.68) 58%,rgba(255,255,255,0) 100%);
  text-shadow:0 1px 1px rgba(255,255,255,1),0 0 7px rgba(255,255,255,.95);
}
.hero .hero-free:before{
  width:4px;height:38px;background:#078b59;
  box-shadow:0 0 0 1px rgba(255,255,255,.45);
}
@media(max-width:760px){
  .hero .hero-free{right:4%;top:33%;font-size:14px;padding:7px 18px 7px 10px}
  .hero .hero-free:before{height:34px}
}
'''
          if marker not in s:
              s = s.replace('</style>', css + '\n</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/improve-hero-caption-contrast.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/improve-hero-caption-contrast.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Improve hero caption visibility'
          git push
