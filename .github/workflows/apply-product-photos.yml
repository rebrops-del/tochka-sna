name: Apply product photos

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add product photos to catalog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = '''
          .photo-media{aspect-ratio:4/3;background:#fff;border-bottom:1px solid var(--line);overflow:hidden;display:block}
          .product-photo{width:100%;height:100%;background-image:url('assets/product-sprite.webp?v=20260905-photos');background-repeat:no-repeat;background-size:500% 500%;background-position:calc(var(--col) * 25%) calc(var(--row) * 25%);background-color:#fff}
          '''
          if '.product-photo{' not in s:
              s = s.replace('</style>', css + '\n</style>')

          photo_map = '''const PHOTO_POS={
          'Матрас Imperial Suite кокос Gray Night':[0,0],
          'Матрас Imperial Suite латекс-кокос Gray Night':[1,0],
          'Матрас Imperial Suite холкон-кокос Gray Night':[2,0],
          'Матрас MEGA MULT ELITE MultiPocket Gray Night':[3,0],
          'Матрас MEGA MULT ЗИМА ЛЕТО MultiPocket Gray Night':[4,0],
          'Матрас MEGA MULT кокос ППУ 20 MultiPocket Gray Night':[0,1],
          'Матрас MEGA Элит Блитц TFK Gray Night':[1,1],
          'Матрас Барселона ZAСоня Gray Night':[2,1],
          'Матрас Валенсия ZAСоня Gray Night':[3,1],
          'Матрас Ибица ZAСоня Gray Night':[4,1],
          'Матрас Касабланка ZAСоня Gray Night':[0,2],
          'Матрас Стандарт':[1,2],
          'Матрас Mega кокос 10 TFK Gray Night':[2,2],
          'Матрас Mega кокос 10 TFK':[3,2],
          'Матрас Mega кокос 20 TFK Gray Night':[4,2],
          'Матрас Mega кокос 20 TFK':[0,3],
          'Матрас Mega кокос 30 TFK Gray Night':[1,3],
          'Матрас Mega кокос 30 TFK':[2,3],
          'Матрас MEGA ППУ 10 ECO':[3,3],
          'Матрас Mega холкон TFK Gray Night':[4,3],
          'Матрас Mega холкон-кокос TFK Gray Night':[0,4],
          'Наматрасник "Непромокаемый чехол"':[1,4],
          'Подушка Память форма':[2,4],
          'Матрас ППУ 16 ZAСоня':[3,4],
          'Матрас Солид ZaСоня':[4,4]
          };
          '''
          if 'const PHOTO_POS=' not in s:
              s = s.replace('let products=[];', photo_map + '\nlet products=[];')

          old = 'return `<article class="card"><div class="body">'
          new = 'const pp=PHOTO_POS[x.model];const photo=pp?`<div class="photo-media"><div class="product-photo" style="--col:${pp[0]};--row:${pp[1]}"></div></div>`:\'\';return `<article class="card">${photo}<div class="body">'
          if old in s:
              s = s.replace(old, new)
          elif '${photo}<div class="body">' not in s:
              raise SystemExit('Card template marker not found')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify photo asset and markup
        run: |
          test -s assets/product-sprite.webp
          grep -q "const PHOTO_POS" index.html
          grep -q "product-photo" index.html
          grep -q '${photo}<div class="body">' index.html

      - name: Commit catalog photos
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show photos in all catalog cards"
          git push
