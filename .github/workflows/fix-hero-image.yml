name: Fix hero image

on:
  push:
    paths:
      - '.github/workflows/fix-hero-image.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and verify hero image
        shell: bash
        run: |
          set -euo pipefail
          PREFIX='UklGRvw6AABXRUJQVlA4IPA6AACw6wGdASpYAjUCPwF2slKrJzSvqBK8KpAgCWduZbvYpBjQ2WnoUN2nv6bW7sP4Nnz9f5DOwhlgE2bx//F/+v/E7Nb/h/Zb0R/t5OeWflX9il7g4XLw5GhiX'
          { printf '%s' "$PREFIX"; cat assets/hero-consultant-mattress.b64; } | base64 -d > assets/hero-consultant-mattress.webp
          test -s assets/hero-consultant-mattress.webp
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('assets/hero-consultant-mattress.webp')
          b=p.read_bytes()
          assert b[:4] == b'RIFF', b[:12]
          assert b[8:12] == b'WEBP', b[:12]
          assert len(b) == 15108, len(b)
          assert hashlib.sha256(b).hexdigest() == '8710fd59f12c0c11e4f7a8cb2c05a7be39ee3cb889531a1c37c0fa27f0aef99e'
          print('valid webp bytes:', len(b))
          PY
          git config user.name "rebrops-del"
          git config user.email "rebrops@gmail.com"
          git add assets/hero-consultant-mattress.webp
          git commit -m "Fix hero image asset"
          git push origin HEAD:main
