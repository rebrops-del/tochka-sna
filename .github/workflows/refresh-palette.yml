name: Refresh site palette

on:
  push:
    paths:
      - '.github/workflows/refresh-palette.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update palette
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text(encoding='utf-8')
          replacements = {
            ':root{--ink:#24352f;--mut:#6b7a73;--line:#dce7e0;--bg:#f5f7f5;--forest:#1d4b3c;--green:#3d725d;--green2:#5b8a75;--sage:#a6c4b4;--mint:#edf5f0;--soft:#fafbf9;--accent:#c97843;--accent2:#a95a31;--accentSoft:#fbefe7;--gold:#d6a45a;--shadow:0 16px 42px rgba(31,79,60,.10)}': ':root{--ink:#263832;--mut:#6b7c75;--line:#dce8e2;--bg:#f6f8f6;--forest:#294f40;--green:#527f6d;--green2:#74a08c;--sage:#b9d0c4;--mint:#eef6f2;--soft:#fbfcfb;--accent:#2f6fa3;--accent2:#255b86;--accentSoft:#edf5fb;--price:#b6782f;--priceSoft:#fff6e7;--gold:#c89a4b;--shadow:0 16px 42px rgba(41,79,64,.10)}',
            '.top{background:#123d30;color:#dcece3': '.top{background:#244b3d;color:#e4f0ea',
            '.brandmark{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,var(--forest),var(--green2));': '.brandmark{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#315c4b,#7aa48f);',
            '.brandtext span{color:var(--accent)}': '.brandtext span{color:var(--green2)}',
            '.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 19px;border-radius:13px;text-decoration:none;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;box-shadow:0 10px 24px rgba(169,90,49,.22);transition:.2s}': '.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 19px;border-radius:13px;text-decoration:none;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;box-shadow:0 10px 24px rgba(47,111,163,.22);transition:.2s}',
            '.hero{background:radial-gradient(circle at 85% 20%,rgba(145,188,162,.24),transparent 30%),linear-gradient(135deg,#143f32,#1e5c46 68%,#2c7658);': '.hero{background:radial-gradient(circle at 85% 18%,rgba(185,208,196,.28),transparent 32%),linear-gradient(135deg,#315a49,#527f6d 68%,#6f9a85);',
            '.deliverybox{background:linear-gradient(135deg,#173f33,#2d7358);': '.deliverybox{background:linear-gradient(135deg,#345e4e,#5a8873);',
            '.step i{display:grid;place-items:center;width:31px;height:31px;border-radius:10px;background:var(--accentSoft);color:var(--accent2);': '.step i{display:grid;place-items:center;width:31px;height:31px;border-radius:10px;background:var(--mint);color:var(--forest);',
            'input:focus,select:focus{outline:none;border-color:#d6a982;box-shadow:0 0 0 3px rgba(201,120,67,.10)}': 'input:focus,select:focus{outline:none;border-color:#8fb4a2;box-shadow:0 0 0 3px rgba(82,127,109,.11)}',
            '.filterhint strong{color:var(--accent2)}': '.filterhint strong{color:var(--forest)}',
            '.tag{font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--accent2);': '.tag{font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--green);',
            '.price{height:39px;line-height:39px;font-size:29px;font-weight:900;color:var(--accent2)}': '.price{height:39px;line-height:39px;font-size:29px;font-weight:900;color:var(--price)}',
            '.cta{background:linear-gradient(135deg,#173f33,#285f4a);': '.cta{background:linear-gradient(135deg,#315848,#4f7b67);',
            '.footer{background:#102f26': '.footer{background:#223f35',
            '<meta name="theme-color" content="#184b3b">': '<meta name="theme-color" content="#527f6d">'
          }
          for old, new in replacements.items():
              t = t.replace(old, new)
          p.write_text(t, encoding='utf-8')
      - name: Commit palette update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Use softer green palette with blue Avito buttons and gold prices"
            git push
          fi
