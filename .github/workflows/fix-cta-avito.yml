name: Match CTA Avito button to cards

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Match CTA button to catalog card buttons
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '''/* cta-avito-brand-fix-v1 */
.cta .btn.avito{background:#fff!important;color:var(--brand-green)!important;border:2px solid #fff!important;box-shadow:none!important}
.cta .btn.avito:hover{background:#EFF8F4!important;color:var(--brand-green)!important;border-color:#EFF8F4!important;filter:none}
'''
          s = s.replace(old, '')

          marker = '/* cta-card-button-match-v1 */'
          css = '''
/* cta-card-button-match-v1 */
.cta .btn.avito{
  background:#fff!important;
  color:var(--brand-green)!important;
  border:1.5px solid var(--brand-green)!important;
  border-radius:999px!important;
  box-shadow:none!important;
  gap:13px!important;
  font-weight:900!important;
  filter:none!important;
  min-height:54px;
  padding:0 20px;
}
.cta .btn.avito::after{
  content:"";
  display:block;
  flex:0 0 18px;
  width:18px;
  height:18px;
  background:radial-gradient(circle at 4px 4px,#00aaff 0 3.8px,transparent 4.1px),radial-gradient(circle at 14px 4px,#ff4053 0 3.8px,transparent 4.1px),radial-gradient(circle at 4px 14px,#965eeb 0 3.8px,transparent 4.1px),radial-gradient(circle at 14px 14px,#04e061 0 3.8px,transparent 4.1px);
}
.cta .btn.avito:hover{
  background:#F5FBF8!important;
  color:var(--brand-green)!important;
  border-color:var(--brand-green)!important;
  box-shadow:0 8px 20px rgba(10,141,85,.10)!important;
  filter:none!important;
}
'''
          if marker not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit change and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-cta-avito.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Match CTA Avito button to catalog cards"
          git push

# trigger-card-match
