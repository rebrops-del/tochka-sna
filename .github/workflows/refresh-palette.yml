name: Refresh site palette

on:
  push:
    paths:
      - '.github/workflows/refresh-palette.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair firmness rendering
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text(encoding='utf-8')
          old = '''const firmBlock=firm?`${firmBlock}`:`<div class="firmness firmness-placeholder" aria-hidden="true"></div>`;'''
          new = '''const firmBlock=firm?`<div class="firmness"><b>Жёсткость:</b><span>${safe(firm).replace(' / 2 сторона','<br>2 сторона')}</span></div>`:`<div class="firmness firmness-placeholder" aria-hidden="true"></div>`;'''
          if old not in t:
              raise SystemExit('Broken firmness fragment not found')
          t = t.replace(old, new)
          if 'const firmBlock=firm?`${firmBlock}`' in t:
              raise SystemExit('Firmness repair failed')
          p.write_text(t, encoding='utf-8')
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text(encoding='utf-8')
          js=re.search(r'<script>(.*)</script>',t,re.S).group(1)
          Path('/tmp/site.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/site.js
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix firmness card rendering"
          git push
