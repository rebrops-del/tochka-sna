name: Use product photo rows

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep catalog photo rows and polish CTA button
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old="background-image:url('assets/product-sprite.webp?v=20260905-photos');background-repeat:no-repeat;background-size:500% 500%;background-position:calc(var(--col) * 25%) calc(var(--row) * 25%);background-color:#fff"
          new="background-repeat:no-repeat;background-size:500% 100%;background-position:calc(var(--col) * 25%) 0;background-color:#fff"
          if old in s:
              s=s.replace(old,new)
          old_style='style="--col:${pp[0]};--row:${pp[1]}"'
          new_style='style="--col:${pp[0]};background-image:url(\'assets/product-row-${pp[1]+1}.webp?v=20260905-photos2\')"'
          if old_style in s:
              s=s.replace(old_style,new_style)

          marker='/* cta-avito-brand-fix-v1 */'
          start=s.find(marker)
          end=s.find('</style>',start)
          if start < 0 or end < 0:
              raise SystemExit('CTA style marker not found')
          cta='''/* cta-avito-brand-fix-v1 */
          .cta .btn.avito{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:58px;padding:0 26px;border-radius:999px!important;background:#fff!important;color:var(--brand-green)!important;border:1.5px solid rgba(255,255,255,.92)!important;box-shadow:0 10px 24px rgba(0,0,0,.10)!important;font-weight:900!important;font-size:16px;line-height:1;white-space:nowrap;text-decoration:none;filter:none!important;transition:transform .18s ease,box-shadow .18s ease,background .18s ease}
          .cta .btn.avito::after{content:"";display:block;flex:0 0 18px;width:18px;height:18px;background:radial-gradient(circle at 4px 4px,#00aaff 0 3.8px,transparent 4.1px),radial-gradient(circle at 14px 4px,#ff4053 0 3.8px,transparent 4.1px),radial-gradient(circle at 4px 14px,#965eeb 0 3.8px,transparent 4.1px),radial-gradient(circle at 14px 14px,#04e061 0 3.8px,transparent 4.1px)}
          .cta .btn.avito:hover{background:#f8fffb!important;color:var(--brand-green)!important;border-color:rgba(255,255,255,.95)!important;transform:translateY(-1px);box-shadow:0 14px 30px rgba(0,0,0,.12)!important;filter:none!important}
          .cta .btn.avito:active{transform:translateY(0);box-shadow:0 8px 18px rgba(0,0,0,.10)!important}
          @media(max-width:620px){.cta .btn.avito{width:100%;min-height:56px;padding:0 18px;font-size:15px}}

          '''
          s=s[:start]+cta+s[end:]

          if 'product-row-${pp[1]+1}.webp' not in s:
              raise SystemExit('Photo row card marker not installed')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify assets and CTA style
        run: |
          test -s assets/product-row-1.webp
          test -s assets/product-row-2.webp
          test -s assets/product-row-3.webp
          test -s assets/product-row-4.webp
          test -s assets/product-row-5.webp
          grep -q 'product-row-${pp\[1\]+1}.webp' index.html
          grep -q 'white-space:nowrap' index.html
          grep -q 'box-shadow:0 10px 24px' index.html
      - name: Commit row assets and CTA style
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Polish lower Avito CTA button"
          git push
