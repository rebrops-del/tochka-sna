name: Fix sticky header overlap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sticky-header-overlap.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add safe anchor offset for sticky header
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;'
          new = '*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:90px}body{margin:0;'
          if old in s:
              s = s.replace(old, new, 1)
          elif 'html{scroll-behavior:smooth;scroll-padding-top:90px}' not in s:
              raise SystemExit('base html scroll rule not found')

          marker = '.wrap{width:min(1180px,calc(100% - 28px));margin:auto}'
          offset_css = '\n#top,#catalog,#guide,#delivery,#about{scroll-margin-top:90px}\n@media(max-width:620px){html{scroll-padding-top:72px}#top,#catalog,#guide,#delivery,#about{scroll-margin-top:72px}}\n'
          if '#top,#catalog,#guide,#delivery,#about{scroll-margin-top:90px}' not in s:
              if marker not in s:
                  raise SystemExit('wrap marker not found')
              s = s.replace(marker, marker + offset_css, 1)

          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-sticky-header-overlap.yml
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-sticky-header-overlap.yml
          git commit -m 'Keep hero label below sticky header'
          git push
