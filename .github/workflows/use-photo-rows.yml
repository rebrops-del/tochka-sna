name: Apply agreed consultant hero

on:
  push:
    paths:
      - '.github/workflows/use-photo-rows.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate consultant and mattress only into hero
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_css = '''.hero{background:radial-gradient(circle at 84% 15%,rgba(235,249,241,.22),transparent 31%),linear-gradient(135deg,#318e68,#55ae80 58%,#82c9a6);color:#fff}.hero .wrap{padding:58px 0 54px}.eyebrow{display:inline-flex;align-items:center;gap:8px;background:#ffffff16;border:1px solid #ffffff2d;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;margin-bottom:18px}.eyebrow:before{content:"";width:8px;height:8px;border-radius:50%;background:#fff34f}.hero h1{font-size:clamp(40px,5vw,66px);letter-spacing:-.04em;line-height:1.02;margin:0 0 18px;max-width:880px}.hero p{font-size:17px;line-height:1.65;color:#e6f1ea;max-width:800px;margin:0 0 24px}.actions{display:flex;gap:12px;flex-wrap:wrap}.advantages{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:30px}.adv{padding:18px;border-radius:18px;background:#ffffff12;border:1px solid #ffffff27}.adv strong{display:block;font-size:17px;margin-bottom:6px}.adv span{font-size:13px;line-height:1.45;color:#dbece2}'''

          new_css = '''.hero{background:linear-gradient(110deg,#f7fbf9 0%,#eef8f3 55%,#eaf5ef 100%);color:var(--ink);overflow:hidden;border-bottom:1px solid #dceae2}.hero .wrap{padding:48px 0 46px;display:grid;grid-template-columns:minmax(0,1.06fr) minmax(390px,.94fr);gap:34px;align-items:center}.hero-copy{min-width:0}.eyebrow{display:inline-flex;align-items:center;gap:8px;background:#e4f5eb;border:1px solid #cbe8d8;color:#15724f;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;margin-bottom:18px}.eyebrow:before{content:"";width:8px;height:8px;border-radius:50%;background:#31b875}.hero h1{font-size:clamp(38px,4.6vw,60px);letter-spacing:-.04em;line-height:1.02;margin:0 0 18px;max-width:660px;color:#123d31}.hero p{font-size:17px;line-height:1.65;color:#536d61;max-width:650px;margin:0 0 24px}.hero .btn.light{background:linear-gradient(135deg,#176b4c,#2d8f68);color:#fff;border:0;box-shadow:0 10px 24px rgba(23,107,76,.20)}.actions{display:flex;gap:12px;flex-wrap:wrap}.advantages{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:30px}.adv{padding:16px;border-radius:18px;background:#fff;border:1px solid #d8e8df;box-shadow:0 8px 24px rgba(31,79,60,.05)}.adv strong{display:block;font-size:16px;margin-bottom:6px;color:#174b38}.adv span{font-size:13px;line-height:1.45;color:#657970}.hero-visual{width:100%;aspect-ratio:1.06/1;border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 22px 54px rgba(24,75,59,.15);border:1px solid #d8e8df}.hero-visual img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}'''

          if old_css not in s:
              raise SystemExit('Expected current hero CSS was not found; aborting without touching the page')
          s = s.replace(old_css, new_css, 1)

          old_header = '''<header class="hero" id="top"><div class="wrap"><div class="eyebrow">Екатеринбургский филиал федеральной онлайн-сети</div><h1>Комфортный сон начинается с правильного матраса</h1><p>«Точка Сна» работает в онлайн-формате: консультация и подбор — дистанционно, заказ оформляется через Avito. Екатеринбургский филиал обслуживает город и ближайшие районы, региональный склад расположен в г. Берёзовский.</p><div class="actions"><a class="btn light" href="#catalog">Смотреть каталог</a><a class="btn avito" target="_blank" rel="noopener">Получить консультацию в Avito</a></div><div class="advantages"><div class="adv"><strong>Подбор по параметрам</strong><span>Учитываем вес, позу сна, желаемую жёсткость и бюджет.</span></div><div class="adv"><strong>Сравнение конструкций</strong><span>Поможем разобраться в беспружинных моделях, TFK и MultiPocket.</span></div><div class="adv"><strong>Сужаем выбор</strong><span>Вместо десятков вариантов предложим 2–3 модели под ваш запрос.</span></div></div></div></header>'''

          new_header = '''<header class="hero" id="top"><div class="wrap"><div class="hero-copy"><div class="eyebrow">Екатеринбургский филиал федеральной онлайн-сети</div><h1>Комфортный сон начинается с правильного матраса</h1><p>«Точка Сна» работает в онлайн-формате: консультация и подбор — дистанционно, заказ оформляется через Avito. Екатеринбургский филиал обслуживает город и ближайшие районы, региональный склад расположен в г. Берёзовский.</p><div class="actions"><a class="btn light" href="#catalog">Смотреть каталог</a><a class="btn avito" target="_blank" rel="noopener">Получить консультацию в Avito</a></div><div class="advantages"><div class="adv"><strong>Подбор по параметрам</strong><span>Учитываем вес, позу сна, желаемую жёсткость и бюджет.</span></div><div class="adv"><strong>Сравнение конструкций</strong><span>Поможем разобраться в беспружинных моделях, TFK и MultiPocket.</span></div><div class="adv"><strong>Сужаем выбор</strong><span>Вместо десятков вариантов предложим 2–3 модели под ваш запрос.</span></div></div></div><div class="hero-visual"><img src="assets/hero-consultant-mattress.webp?v=20260905-hero1" alt="Консультант Точка Сна рядом с матрасом" width="900" height="847"></div></div></header>'''

          if old_header not in s:
              raise SystemExit('Expected current hero HTML was not found; aborting without touching the page')
          s = s.replace(old_header, new_header, 1)

          responsive = '''
@media(max-width:1000px){.hero .wrap{grid-template-columns:minmax(0,1fr) minmax(310px,.8fr);gap:24px}.hero .advantages{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.hero .wrap{grid-template-columns:1fr;gap:24px;padding:40px 0}.hero-copy{order:1}.hero-visual{order:2;min-height:400px;aspect-ratio:1.12/1;border-radius:22px}.hero .advantages{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.hero .advantages{grid-template-columns:1fr}.hero-visual{min-height:320px;aspect-ratio:1.05/1}}
'''
          marker = '\n</style>'
          if marker not in s:
              raise SystemExit('Style closing tag not found')
          s = s.replace(marker, responsive + marker, 1)

          # Guardrails: delivery and catalog must remain actual HTML sections.
          required = [
              '<section class="section delivery" id="delivery">',
              '<section class="section catalog" id="catalog">',
              'const AVITO=',
              'const products=',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit(f'Guardrail failed: {missing}')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify hero-only integration
        run: |
          grep -q 'class="hero-visual"' index.html
          grep -q 'assets/hero-consultant-mattress.webp' index.html
          grep -q '<section class="section delivery" id="delivery">' index.html
          grep -q '<section class="section catalog" id="catalog">' index.html
          test -s assets/hero-consultant-mattress.webp

      - name: Commit hero integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Integrate consultant and mattress into live hero"
          git push
