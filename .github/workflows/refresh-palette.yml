name: Refresh site palette

on:
  push:
    paths:
      - '.github/workflows/refresh-palette.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update palette and firmness layout
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text(encoding='utf-8')
          t = t.replace(
              ':root{--ink:#173a2a;--mut:#60776b;--line:#d9eee1;--bg:#f4fff7;--forest:#08783f;--green:#20bd66;--green2:#43d77f;--sage:#b9efcd;--mint:#eafff1;--soft:#fbfffc;--avito:#00aaff;--avito2:#008cff;--avitoSoft:#e9f8ff;--price:#f2b705;--priceDark:#9a7000;--hit:#ef3340;--shadow:0 16px 42px rgba(16,145,75,.13)}',
              ':root{--ink:#173a2a;--mut:#60776b;--line:#d9eee1;--bg:#f7fcf8;--forest:#08783f;--green:#20bd66;--green2:#43d77f;--sage:#b9efcd;--mint:#eafff1;--soft:#fbfffc;--avito:#00aaff;--avito2:#008cff;--avitoSoft:#e9f8ff;--price:#e6323d;--priceDark:#b71f2b;--hit:#ef3340;--shadow:0 16px 42px rgba(16,145,75,.11)}'
          )
          t = t.replace(
              '.hero{background:radial-gradient(circle at 84% 15%,rgba(154,255,190,.30),transparent 31%),linear-gradient(135deg,#078b47,#19b95f 58%,#47d983);',
              '.hero{background:radial-gradient(circle at 84% 15%,rgba(206,244,220,.24),transparent 31%),linear-gradient(135deg,#2f9967,#45b77b 58%,#72cc9c);'
          )
          t = t.replace(
              '.deliverybox{background:linear-gradient(135deg,#0a994d,#2ccc72);',
              '.deliverybox{background:linear-gradient(135deg,#2f9868,#58b985);'
          )
          t = t.replace(
              '.price{height:42px;line-height:42px;font-size:31px;font-weight:950;color:var(--price);text-shadow:0 1px 0 rgba(154,112,0,.18)}',
              '.price{height:42px;line-height:42px;font-size:31px;font-weight:950;color:var(--price);text-shadow:none}'
          )
          t = t.replace(
              '.firmness{background:#edfff3;border:1px solid #ccefd8;border-radius:14px;padding:11px 13px;color:#365a4a;font-size:13px;line-height:1.35;min-height:58px;display:flex;align-items:center}.firmness b{color:var(--forest);margin-right:5px;white-space:nowrap}',
              '.firmness{background:#edfff3;border:1px solid #ccefd8;border-radius:14px;padding:11px 13px;color:#365a4a;font-size:13px;line-height:1.35;min-height:58px;display:flex;align-items:flex-start}.firmness b{color:var(--forest);margin-right:5px;white-space:nowrap}.firmness span{display:block}'
          )
          t = t.replace(
              '''<div class="firmness"><b>Жёсткость:</b> ${safe(firm)}</div>''',
              '''<div class="firmness"><b>Жёсткость:</b><span>${safe(firm).replace(' / 2 сторона','<br>2 сторона')}</span></div>'''
          )
          p.write_text(t, encoding='utf-8')
      - name: Commit site update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Use red prices, softer green backgrounds and stacked firmness lines"
            git push
          fi
