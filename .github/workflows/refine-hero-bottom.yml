name: Refine hero bottom crop only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-hero-bottom.yml'

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep previous hero framing and crop only bottom edge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'transform:scale(1.04);transform-origin:50% 0;will-change:transform'
          new = 'transform:scale(1.016);transform-origin:50% 0;will-change:transform'
          if old not in s:
              raise SystemExit('expected hero crop rule not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/refine-hero-bottom.yml
      - name: Commit refined crop
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/refine-hero-bottom.yml
          git commit -m 'Crop only hero image bottom edge'
          git push
